name: cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "overlays/**"
      - "pkgs/**"
      - ".github/workflows/cache.yml"
  schedule:
    - cron: "0 4 * * 0"

concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  x86_64-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra-conf: |
            extra-substituters = https://nirlvy.cachix.org https://niri.cachix.org https://noctalia.cachix.org https://cache.nixos-cuda.org
            extra-trusted-public-keys = nirlvy.cachix.org-1:dOdsWPG0r4JuqWy+p150yPiVrC28tELUZUdkXobrKZM= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

      - uses: cachix/cachix-action@v17
        with:
          name: nirlvy
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and push flake packages
        run: |
          set -euo pipefail

          expr='
            let
              flake = builtins.getFlake (toString ./.);
              base = import flake.inputs.nixpkgs {
                system = "x86_64-linux";
                config = {
                  allowUnfree = true;
                  permittedInsecurePackages = [ ];
                };
              };
              overlays = import ./overlays { inputs = flake.inputs; };
              pkgs = base.extend (base.lib.composeManyExtensions (overlays ++ [
                flake.inputs.niri.overlays.default
                flake.inputs.xwayland-satellite.overlays.default
              ]));
              names = [
                # "StarRailGrubThemes-firefly"
                # "anime4k"
                # "aris-plymouth"
                # "catppuccin-gtk"
                # "ja-netfilter"
                "jetbrains-maple-mono"
                "mpv"
                "niri"
                # "sddm-eucalyptus-drop"
                # "sddm-sugar-candy"
                # "svp"
                "tela-icon-theme"
                # "ttf-wps-fonts"
                # "waydroid_script"
                "wl-shot-edit"
                "xwayland-satellite"
              ];
            in
              map (name: pkgs.${name}) names
              ++ [ pkgs.qt6Packages.fcitx5-configtool ]
          '

          # Read the repository's flake inputs and overlays without adding
          # package outputs to flake.nix. Keep stdout clean for the store paths.
          set +e
          nix build --no-link --keep-going --print-out-paths --impure \
            --expr "$expr" > /tmp/built-paths
          build_status=$?
          set -e

          # Push successful outputs even when another target failed, then
          # preserve the Nix build's exit status so failures remain visible.
          if [ -s /tmp/built-paths ]; then
            cachix push nirlvy < /tmp/built-paths
          fi
          exit "$build_status"
