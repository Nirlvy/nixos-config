# Builds the full system closure on GitHub runners and pushes it to the Cachix
# cache, while substituting everything it can from caches that already have it.
#
# Two goals, both handled here:
#   1. Cache all software: `system.build.toplevel` is the whole NixOS closure
#      (~21.5 GB / ~2000 store paths for this configuration), so a local
#      `nixos-rebuild` downloads instead of compiling.
#   2. Never rebuild what is already cached: the substituters below cover
#      cache.nixos.org (the entire base system), niri.cachix.org,
#      noctalia.cachix.org and this cache itself, so only genuinely new or
#      locally built derivations get built.
#
# Cache: https://nirlvy.cachix.org (public cache "nirlvy").
#
# One-time setup on the GitHub repository:
#   * Repository secret CACHIX_AUTH_TOKEN = a Cachix *write* token for "nirlvy".
#     Never commit the token itself: the cache name and its public key are
#     public, the token is not.
#   * The public key already sits in modules/desktop/niri.nix.
name: cache

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "flake.nix"
      - "flake.lock"
      - "overlays/**"
      - "pkgs/**"
      - "modules/**"
      - "home/**"
      - "secrets/**"
      - "self-module/**"
      - "hosts/**"
      - ".github/workflows/cache.yml"
  schedule:
    # Weekly, so the cache follows upstream without waiting for a push.
    - cron: "0 4 * * 0"

# Never let two runs write the same cache entry concurrently.
concurrency:
  group: cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  x86_64-linux:
    runs-on: ubuntu-latest
    # A cold run pushes ~20 GB, so allow a generous budget.
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      # extra-conf: the substituters this configuration actually uses, so the
      # build below substitutes instead of recompiling. Kept in sync with
      # modules/base/nix.nix + modules/desktop/niri.nix.
      - uses: cachix/install-nix-action@v31
        with:
          extra-conf: |
            extra-substituters = https://nirlvy.cachix.org https://niri.cachix.org https://noctalia.cachix.org https://cache.nixos-cuda.org
            extra-trusted-public-keys = nirlvy.cachix.org-1:dOdsWPG0r4JuqWy+p150yPiVrC28tELUZUdkXobrKZM= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964= noctalia.cachix.org-1:pCOR47nnMEo5thcxNDtzWpOxNFQsBRglJzxWPp3dkU4= cache.nixos-cuda.org:74DUi4Ye579gUqzH4ziL9IyiJBlDpMRn9MBN8oNan9M=

      - uses: cachix/cachix-action@v17
        with:
          name: nirlvy
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"

      - name: Build and push
        run: |
          set -euo pipefail

          # Only cache what is both (a) expensive to compile and (b) absent from
          # public caches. The Cachix quota is 5 GB, and the whole system closure
          # is ~21.5 GB, so caching everything is not an option anyway.
          #
          #   xwayland-satellite  built from upstream main (~1-2 min, no public
          #                       cache) -- the only real candidate today
          #   niri                currently pkgs.niri, which comes from
          #                       niri.cachix.org, so it needs no local cache;
          #                       if it is ever built from source (upstream
          #                       main), the same target starts covering it
          #
          # Deliberately NOT cached: private/prebuilt packages that no compiler
          # produces (pycharm, wpsoffice-cn, vscode, ...) and everything already
          # served by cache.nixos.org / niri.cachix.org.
          targets=(
            ".#nixosConfigurations.Runtime.config.programs.niri.package"
            ".#nixosConfigurations.Runtime.config.home-manager.users.nirlvy.home.packages"
          )

          nix build --no-link --print-out-paths "${targets[@]}" | tee /tmp/created

          # ?compression=zstd is required: Cachix only accepts zstd-compressed
          # NARs (its API reports preferredCompressionMethod=ZSTD), and a plain
          # https://...cachix.org URL uploads .nar.xz instead, which Cachix
          # rejects with HTTP 405 "Method not supported". Lix has no
          # `compression` nix.conf setting, so this URL parameter is the fix.
          cache="https://nirlvy.cachix.org?compression=zstd"

          # Filter to the expensive, non-public pieces. nix copy itself only
          # skips paths already in the *destination*; it never consults upstream
          # caches, so a public path reachable from the targets above would
          # otherwise be uploaded and eat quota (llvm, linux-firmware, ...).
          # Same idea as devenv's "Upstream caches": skip if any public cache
          # already has the path (a store path carries its own lookup hash).
          #
          # The cache list is a plain string, not an array: it is handed to the
          # xargs subshell as an argument, and arrays do not survive that.
          upstream="https://cache.nixos.org https://niri.cachix.org https://noctalia.cachix.org"

          while read -r path; do
            nix-store -qR "$path"
          done < /tmp/created | sort -u > /tmp/all
          echo "closure: $(wc -l < /tmp/all) paths"

          # 16 parallel lookups; only the leftovers are worth uploading.
          # shellcheck disable=SC2016  # $1/$upstream expand in the child shell
          xargs -P 16 -I{} bash -c '
            h=$(basename "$1"); h=${h%%-*}
            for c in $2; do
              if curl -sf -o /dev/null -m 15 --head "$c/$h.narinfo"; then exit 0; fi
            done
            printf "%s\n" "$1"
          ' _ {} "$upstream" < /tmp/all > /tmp/topush || true
          sort -u /tmp/topush -o /tmp/topush
          echo "to push: $(wc -l < /tmp/topush) paths"

          while read -r path; do
            echo "pushing $path"
            nix copy --to "$cache" "$path"
          done < /tmp/topush
