# Keeps the custom packages in pkgs/ up to date.
#
# What it does (see scripts/update-pkgs.py):
#   * revision bumps in pkgs/ -> waydroid_script, sddm-sugar-candy,
#                                StarRailGrubThemes-firefly, ttf-wps-fonts,
#                                jetbrains-maple-mono, with hashes recomputed by
#                                nix itself (never by hand)
#
# This workflow only updates pkgs/, leaving flake.lock updates separate.
#
# The result arrives as a pull request, so a broken bump never lands on main.
name: update-pkgs

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1" # Mondays

concurrency:
  group: update-pkgs
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check PR automation credentials
        env:
          UPDATE_PR_TOKEN: ${{ secrets.UPDATE_PR_TOKEN }}
        run: |
          if [ -z "$UPDATE_PR_TOKEN" ]; then
            echo "::error::Set UPDATE_PR_TOKEN so update PRs can trigger cache CI without manual approval; see .github/README.md"
            exit 1
          fi

      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra-conf: |
            extra-substituters = https://nirlvy.cachix.org https://niri.cachix.org
            extra-trusted-public-keys = nirlvy.cachix.org-1:dOdsWPG0r4JuqWy+p150yPiVrC28tELUZUdkXobrKZM= niri.cachix.org-1:Wv0OmO7PsuocRKzfDoJ3mulSl7Z6oezYhGhR+3W2964=

      - name: Update package sources
        run: python3 scripts/update-pkgs.py --no-flake-update

      - name: Verify the configuration still evaluates and builds
        run: |
          nix build --no-link \
            .#nixosConfigurations.Runtime.config.system.build.toplevel

      - name: Open or update the pull request
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.UPDATE_PR_TOKEN }}
          branch: chore/update-pkgs
          add-paths: pkgs/**
          commit-message: "chore: bump custom packages"
          title: "chore: bump custom packages"
          body: |
            Automated by `.github/workflows/update-pkgs.yml`
            (`scripts/update-pkgs.py`).

            The full system closure was built successfully in this run, so the
            bump is at least buildable. Mergify will merge this PR after the
            cache-build check passes against the latest main branch.
          delete-branch: true
          labels: automated
